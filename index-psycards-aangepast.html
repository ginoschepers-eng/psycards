<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#1f4e78">
  <title>Psycards</title>
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;margin:0;background:#f5f7fb;color:#14213d}
    .loading{max-width:520px;margin:70px auto;padding:24px}
    .box{background:white;border-radius:18px;padding:22px;box-shadow:0 2px 12px rgba(0,0,0,.08)}
    .error{color:#8a1c1c}
  </style>
</head>
<body>
  <div class="loading">
    <div class="box" id="loaderBox">
      <h2>Psycards laden…</h2>
      <div>De nieuwste veilige invoerversie wordt gestart.</div>
    </div>
  </div>

<script>
(async()=>{
  const SOURCE_URL = "https://raw.githubusercontent.com/ginoschepers-eng/psycards/a4a7cd7ff8e8fed059e08ed589166eb3d093b475/index.html";
  const loader = document.getElementById('loaderBox');

  try{
    let html = await fetch(SOURCE_URL, {cache:'no-store'}).then(r=>{
      if(!r.ok) throw new Error('Bronbestand kon niet worden geladen ('+r.status+').');
      return r.text();
    });

    // Extra variabelen voor invoerbeveiliging.
    html = html.replace(
      "let activeSetName='',activeSetCode='';",
      "let activeSetName='',activeSetCode='';\\nlet psycardsUnsavedChanges=false;\\nlet psycardsRestoringHistory=false;"
    );

    // Vervang de bestaande terugknop-afhandeling door een beveiligde versie.
    const oldPopstate = `let psycardsExitArmed=false;
window.addEventListener('popstate',event=>{
  if(sessionStorage.getItem('psycards-login')!=='yes')return;
  const target=event.state?.psycardsSection;
  if(!target){
    history.pushState({psycardsSection:'home'},'','#home');
    if(!psycardsExitArmed){
      psycardsExitArmed=true;
      setTimeout(()=>psycardsExitArmed=false,2500);
      alert('Je staat op het beginscherm. Druk nogmaals op terug als je Psycards echt wilt verlaten.');
      return;
    }
    history.back();
    return;
  }
  psycardsExitArmed=false;
  show(target,true);
  if(target==='stock')renderStock();
  if(target==='money')renderMoney();
  if(target==='sold')renderSold();
});`;

    const newPopstate = `window.addEventListener('popstate',event=>{
  if(sessionStorage.getItem('psycards-login')!=='yes')return;

  if(psycardsRestoringHistory){
    psycardsRestoringHistory=false;
    return;
  }

  const current=document.querySelector('main>section:not(.hidden)')?.id||'';
  const protectedSection=['new','setCards','edit'].includes(current);

  if(protectedSection&&psycardsUnsavedChanges){
    const leave=confirm('Je hebt nog niet-opgeslagen wijzigingen. Wil je deze pagina echt verlaten?');
    if(!leave){
      psycardsRestoringHistory=true;
      history.forward();
      return;
    }
    psycardsUnsavedChanges=false;
  }

  const target=event.state?.psycardsSection||'home';
  show(target,true);
  if(target==='stock')renderStock();
  if(target==='money')renderMoney();
  if(target==='sold')renderSold();
});`;

    if(!html.includes(oldPopstate)) throw new Error('De terugknop-code kon niet veilig worden aangepast.');
    html = html.replace(oldPopstate, newPopstate);

    // Mobiele invoerverbeteringen:
    // - standaard 1 verdwijnt bij aantikken;
    // - lege invoer wordt bij verlaten weer 1;
    // - wijzigingen worden gemarkeerd voor de terugknop-waarschuwing.
    const enhancementScript = `
<script>
(function(){
  function protectedSection(){
    return document.querySelector('main>section:not(.hidden)')?.id||'';
  }

  function isQuantityInput(input){
    if(!(input instanceof HTMLInputElement)||input.type!=='number')return false;
    return input.id==='quantity'
      || input.id==='sellQuantity'
      || input.id==='editQuantity'
      || !!input.closest('.set-variant-option');
  }

  document.addEventListener('focusin',function(event){
    const input=event.target;
    if(!isQuantityInput(input)||input.value!=='1')return;
    input.dataset.psycardsStartedAsOne='1';
    input.value='';
  },true);

  document.addEventListener('focusout',function(event){
    const input=event.target;
    if(!(input instanceof HTMLInputElement)||input.dataset.psycardsStartedAsOne!=='1')return;
    delete input.dataset.psycardsStartedAsOne;
    if(input.value.trim()===''){
      input.value='1';
      input.dispatchEvent(new Event('input',{bubbles:true}));
    }
  },true);

  function markChanged(event){
    const section=event.target?.closest?.('main>section')?.id||'';
    if(['new','setCards','edit'].includes(section))psycardsUnsavedChanges=true;
  }
  document.addEventListener('input',markChanged,true);
  document.addEventListener('change',markChanged,true);

  // Na een bewuste opslagactie hoeft de terugknop niet meer te waarschuwen.
  document.addEventListener('click',function(event){
    const button=event.target.closest?.('button');
    if(!button)return;
    const onclick=button.getAttribute('onclick')||'';
    if(/saveCard\\(|saveSetEntry\\(|saveEdit\\(/.test(onclick)){
      setTimeout(function(){psycardsUnsavedChanges=false;},1000);
    }
  },true);

  // Ook bij vernieuwen/sluiten waarschuwen wanneer er nog invoer staat.
  window.addEventListener('beforeunload',function(event){
    const section=protectedSection();
    if(!psycardsUnsavedChanges||!['new','setCards','edit'].includes(section))return;
    event.preventDefault();
    event.returnValue='';
  });
})();
<\/script>`;

    html = html.replace('</body>', enhancementScript + '\n</body>');

    document.open();
    document.write(html);
    document.close();

  }catch(err){
    loader.innerHTML =
      '<h2 class="error">Psycards kon niet starten</h2>'+
      '<p>'+String(err.message||err)+'</p>'+
      '<p>Controleer de internetverbinding en probeer de pagina opnieuw te openen.</p>';
  }
})();
</script>
</body>
</html>
